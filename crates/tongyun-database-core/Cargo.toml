[package]
name = "tongyun-database-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File secret store, legacy connection migration, and desktop host helpers"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "5"
hkdf = "0.12"
rand = "0.8"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "tongyun-database-secrets"
path = "src/bin/tongyun-database-secrets.rs"
