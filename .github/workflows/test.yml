name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-and-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rust format and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p tongyun-database-core
          cargo build --locked -p tongyun-database-core --bin tongyun-database-secrets

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          TONGYUN_REQUIRE_SECRETS_BIN: "1"

      - name: Check
        run: npm run check
        env:
          TONGYUN_REQUIRE_SECRETS_BIN: "1"

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo check --locked -p tongyun-database-desktop
