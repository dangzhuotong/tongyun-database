name: Release Mac App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

      - name: Build Mac app
        run: bash scripts/build-mac-app.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tongyun-database-mac.zip
          generate_release_notes: true
